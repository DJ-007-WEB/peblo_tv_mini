services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: peblo
      POSTGRES_USER: peblo
      POSTGRES_PASSWORD: peblo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peblo -d peblo"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://peblo:peblo@db:5432/peblo
      STORAGE_DIR: /app/storage
      CATALOG_PATH: /app/storage/catalogue.json
      EDITOR_TOKEN: ${EDITOR_TOKEN:-peblo-editor-token}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-peblo-admin-token}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:4173,http://localhost:4174}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    depends_on:
      db:
        condition: service_healthy
    command: ["/app/start.sh"]
    volumes:
      - api-storage:/app/storage
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5

  cms:
    build:
      context: .
      dockerfile: cms/Dockerfile
      args:
        VITE_API_BASE: http://localhost:8000
    environment:
      API_BASE_URL: http://localhost:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "4173:80"

  viewer:
    build:
      context: .
      dockerfile: viewer/Dockerfile
      args:
        VITE_API_BASE: http://localhost:8000
    environment:
      API_BASE_URL: http://localhost:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "4174:80"

volumes:
  postgres-data:
  api-storage:
